<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3a1310" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <!-- THIN RIBBON: the only permanently visible chrome -->
  <div class="ribbon">
    <button id="sidebar-toggle-btn" class="ribbon-btn" title="Folders & entries">☰</button>

    <span class="ribbon-divider"></span>

    <button data-action="h1" class="ribbon-btn">H1</button>
    <button data-action="h2" class="ribbon-btn">H2</button>
    <button data-action="bold" class="ribbon-btn ribbon-bold">B</button>
    <button data-action="italic" class="ribbon-btn ribbon-italic">i</button>
    <button data-action="list" class="ribbon-btn">List</button>

    <span class="ribbon-divider"></span>

    <select id="font-size-select" class="ribbon-select" title="Font size">
      <option value="13">Small</option>
      <option value="15" selected>Medium</option>
      <option value="18">Large</option>
      <option value="22">Extra large</option>
    </select>

    <select id="note-type-select" class="ribbon-select" title="Note type">
      <option value="plain">Plain</option>
      <option value="scriptwriter">Scriptwriter</option>
      <option value="author">Author</option>
      <option value="diary">Diary</option>
      <option value="postit">Post-it</option>
    </select>

    <select id="theme-select" class="ribbon-select" title="Theme">
      <option value="classic">Classic</option>
      <option value="night">Night</option>
      <option value="sepia">Sepia</option>
      <option value="blueprint">Blueprint</option>
      <option value="mint">Mint</option>
    </select>

    <span class="save-status" id="save-status"></span>
    <button id="install-btn" class="ribbon-btn hidden" title="Download desktop">⬇ Desktop</button>
    <button id="delete-entry-btn" class="ribbon-btn ribbon-danger">Delete</button>
  </div>

  <div class="body-area">
    <!-- SIDEBAR: hidden by default, slides in as an overlay drawer -->
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <input id="journal-name" class="journal-name-input" spellcheck="false" />
      </div>
      <div class="sidebar-actions">
        <button id="new-folder-btn" title="New folder" class="icon-btn">+ folder</button>
        <button id="new-file-btn" title="New entry" class="icon-btn">+ entry</button>
      </div>
      <div id="tree" class="tree"></div>
    </aside>

    <main class="main">
      <div class="page-wrap" id="page-wrap">
        <div class="zoom-outer" id="zoom-outer">
          <div class="canvas" id="canvas">
            <div class="page-column">
              <div class="page" id="page">
                <input id="entry-title" class="entry-title" />
                <textarea id="entry-editor" class="entry-editor" placeholder="Start writing..."></textarea>
              </div>
              <div id="page-tabs" class="page-tabs"></div>
            </div>
          </div>
        </div>
        <p id="empty-state" class="empty-state hidden">Select an entry, or create a new one.</p>
        <div class="zoom-controls">
          <button id="zoom-out-btn" class="zoom-btn" title="Zoom out">−</button>
          <span id="zoom-level" class="zoom-level">100%</span>
          <button id="zoom-in-btn" class="zoom-btn" title="Zoom in">+</button>
          <button id="zoom-reset-btn" class="zoom-btn zoom-reset" title="Fit to width">Fit</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
